name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 根模块（商城）：vet + 全部测试（含连 MySQL/Redis 的集成测试与真 billing 子进程用例）
  mall:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
      MARKET_MYSQL_DSN: root:root@tcp(127.0.0.1:3307)/market?parseTime=true&loc=Local
      CONTROL_PLANE_TOKEN: ci-control-token
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports: ["3307:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7
        ports: ["6381:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # 真 billing 集成测试（services/mall-order worker/refund 等）直读
      # deploy/compose/.env（gitignored，CI 写入合法测试值）。
      - name: Write test .env (gitignored; CI-only bootstrap)
        run: |
          mkdir -p deploy/compose
          cat > deploy/compose/.env <<'EOF'
          MYSQL_ROOT_PASSWORD=root
          CONTROL_PLANE_TOKEN=ci-control-token
          PAY_CALLBACK_SECRET=ci-callback-secret
          AGENT_LLM_API_KEY=
          EOF
      - name: Install mysql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
      - name: Init schemas and seeds
        run: |
          mysql -h 127.0.0.1 -P 3307 -uroot -proot < services/billing/scripts/schema.sql
          mysql -h 127.0.0.1 -P 3307 -uroot -proot < docs/spec/db-schema.sql
          mysql -h 127.0.0.1 -P 3307 -uroot -proot < scripts/seed-plans.sql
          mysql -h 127.0.0.1 -P 3307 -uroot -proot < scripts/seed-goods.sql
      - name: vet
        run: go vet ./...
      - name: test
        # R2.7 单模块：mall 域包面（服务 internal 已受 Go 编译器管束，跨树 import
        # 编译期即红）；ai 域测试由 ai-gateway job 的失败名基线门禁覆盖。
        run: go test ./services/mall-goods/... ./services/mall-order/... ./services/mall-bff/... ./pkg/mallerr/... ./pkg/mallpage/... ./pkg/importguard/... -count=1

  # ai-gateway 模块：与旧仓 CI 同口径（AGENT_LIVE_JEV=0 + MySQL/Redis 服务；CGO=0 为门禁口径）
  ai-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CGO_ENABLED: "0"
      AGENT_LIVE_JEV: "0"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports: ["3307:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7
        ports: ["6381:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install mysql client and init schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
          mysql -h 127.0.0.1 -P 3307 -uroot -proot < services/billing/scripts/schema.sql
      - name: vet
        run: go vet ./...
      # 失败名基线门禁：只拒绝基线之外的新增失败；基线内失败被修复会提示收缩基线。
      # 已知失败集（load/环境敏感）见 tools/verify/ci-baseline-ai-gateway.txt，只减不增。
      # GOTEST_TARGET 收窄到 ai 域包面（mall 域由 mall job 绿测覆盖，见其 test 步骤注释）。
      - name: test
        run: GOTEST_TARGET="./services/gateway/... ./services/billing/... ./services/router/... ./services/agent/... ./services/mock-provider/... ./pkg/... ./tools/..." bash tools/verify/ci-gotest-baseline.sh tools/verify/ci-baseline-ai-gateway.txt
      # 脚本双打测试套件为 Unix 向（fcntl/O_NOFOLLOW/POSIX 路径），在 Linux 跑（本地 macOS 337 全绿的等价环境）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Script doubles unittest
        run: python -m unittest discover -s tools/verify/tests

  # 冻结证据跨平台字节保真（Windows 换行场景）+ 离线契约（与旧仓一致）
  offline-evaluation:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      AGENT_LIVE_JEV: "0"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve historical evidence
        run: |
          python tools/verify/customer-service-contract.py verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify/archive-intent-contract.py verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify/summarize-offline-intent-audit.py verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify/prepare-customer-fixtures.py verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify/verify-task-definition-archive.py verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify/prepare-runtime-customer-profiles.py verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify/audit-historical-answer-evidence.py verify
          exit $LASTEXITCODE

  # ai-gateway web 前端契约校验（与旧仓一致）
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/gateway/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/gateway/web/package-lock.json
      - name: verify
        run: npm ci && npm run verify
