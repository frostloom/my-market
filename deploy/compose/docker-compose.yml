# my-market 分 profile compose（R0 infra+ai / R1 mall）。
#   infra：MySQL(3307, utf8mb4) / Redis(6381) / Kafka(宿主 29092) —— 端口与旧 ai-gateway compose 一致
#   ai：   gateway / billing / router / agent / mock-provider（本地构建，共享 ai-gateway/deploy/docker/go-service.Dockerfile）
#   mall： mall-goods(gRPC 9111/健康口 9110) / mall-order(9112/9120) / mall-bff(18090)
#          （本地构建，deploy/docker/mall-service.Dockerfile，上下文=仓库根）
#
# 用法：
#   cp deploy/compose/.env.example deploy/compose/.env   # 先填 CONTROL_PLANE_TOKEN / PAY_CALLBACK_SECRET（生成命令见模板注释）
#   docker compose -f deploy/compose/docker-compose.yml --profile infra up -d
#   docker compose -f deploy/compose/docker-compose.yml --profile ai up -d
#   docker compose -f deploy/compose/docker-compose.yml --profile mall up -d
#   （三个 profile 可合用：--profile infra --profile ai --profile mall up -d；
#     mall-bff 的会话链路依赖 ai 组的 gateway:18080 —— 全家桶起法见 scripts/smoke-r1.sh 前置检查）
#
# 机器侧副作用（2026-11-18 首次起栈时处理）：旧仓遗留容器 ai-gateway-mysql / ai-gateway-redis /
# ai-gateway-kafka 占着宿主 3307/6381/29092，与本栈端口冲突，已 docker stop（未删除，数据卷保留）。
# 要回旧仓环境时：先停本栈，再 docker start ai-gateway-mysql ai-gateway-redis ai-gateway-kafka。
#
# 容器内互访一律走服务名 + 容器端口（mysql:3306 / redis:6379 / billing:9101 …），
# 与宿主映射端口（3307/6381/29092）无关；各服务显式 LISTEN_HOST=0.0.0.0 才能被映射/互访
# （代码默认 LISTEN_HOST=127.0.0.1，见 ai-gateway/internal/pkg/config.ListenAddr，容器里不设则全不通）。
name: my-market

services:
  # ================= infra =================
  mysql:
    profiles: [infra]
    # 国内网络 Docker Hub 直连不通，用 daocloud 镜像 tag（网络可达环境可改回 mysql:8.0）
    image: docker.m.daocloud.io/library/mysql:8.0.40
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ai_gateway
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次建库自动建表：schema.sql 自带 CREATE DATABASE/USE ai_gateway（只读挂载，不改 SQL 内容）
      - ../../ai-gateway/scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    profiles: [infra]
    image: docker.m.daocloud.io/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6381:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Kafka 计费事件流（apache/kafka 官方镜像，KRaft 单节点无 zookeeper，与旧仓 compose 相同）。
  # 双 listener：PLAINTEXT(kafka:9092) 供容器内客户端；PLAINTEXT_HOST(宿主 29092) 供宿主本地进程连。
  # 单 advertised=localhost 会让容器内客户端按 advertised 连回自己 localhost → 失败。
  kafka:
    profiles: [infra]
    image: docker.m.daocloud.io/apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # KAFKA_LOG_DIRS 指向镜像声明的 VOLUME 路径 /var/lib/kafka/data（属主 appuser uid 1000），
      # 命名卷首次创建会继承镜像内目录属主，可写。不能用 /tmp 下的自造路径（镜像无此目录 →
      # 新卷变 root 属主 → appuser 写 meta.properties 被拒、启动失败，已实测复现）。
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    ports:
      - "29092:29092" # 宿主 → PLAINTEXT_HOST（宿主本地进程用 127.0.0.1:29092）
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 30s
      retries: 30

  # 一次性建 topic（幂等）：主事件流 + 死信流，各 3 分区。kafka 健康后才执行。
  # command 必须是单元素数组交给 bash -c 整段执行（字符串会被按空白拆参）。
  kafka-init:
    profiles: [infra]
    image: docker.m.daocloud.io/apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: ["/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic billing.events --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config flush.messages=1 --config flush.ms=0 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic billing.events.dlq --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config flush.messages=1 --config flush.ms=0"]

  # ================= ai =================
  # billing 先于 gateway（gateway gRPC 拨号虽是惰性，但保持启动次序清晰）。
  billing:
    profiles: [ai]
    build:
      context: ../../ai-gateway
      dockerfile: deploy/docker/go-service.Dockerfile
      args: { SVC: billing }
    image: my-market/billing:local
    restart: unless-stopped
    environment:
      LISTEN_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 控制面令牌：billing/router/gateway/agent 未设置会直接退出，compose 里用 :? 在解析期就报错
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:?CONTROL_PLANE_TOKEN is required - see deploy/compose/.env.example}
      BILLING_PORT: "9101"
      BILLING_ADMIN_PORT: "9103"
      MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:-root}@tcp(mysql:3306)/ai_gateway?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 容器内恒连内部 listener kafka:9092（此变量留空也用该默认，不会禁用 relay）；
      # 仅宿主本地进程跑 billing 时才需要 127.0.0.1:29092
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      SUB_RENEW_INTERVAL_SEC: ${SUB_RENEW_INTERVAL_SEC:-60}
    ports:
      - "9101:9101" # gRPC 控制面
      - "9103:9103" # admin 观测 HTTP（/healthz /metrics）
    depends_on:
      # infra 属另一 profile：单独 --profile ai 时依赖自动跳过（容器经 restart 轮询重试）
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9103/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12

  router:
    profiles: [ai]
    build:
      context: ../../ai-gateway
      dockerfile: deploy/docker/go-service.Dockerfile
      args: { SVC: router }
    image: my-market/router:local
    restart: unless-stopped
    environment:
      LISTEN_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:?CONTROL_PLANE_TOKEN is required - see deploy/compose/.env.example}
      ROUTER_PORT: "9102"
      MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:-root}@tcp(mysql:3306)/ai_gateway?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "9102:9102"
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9102/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12

  agent:
    profiles: [ai]
    build:
      context: ../../ai-gateway
      dockerfile: deploy/docker/go-service.Dockerfile
      args: { SVC: agent }
    image: my-market/agent:local
    restart: unless-stopped
    environment:
      LISTEN_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:?CONTROL_PLANE_TOKEN is required - see deploy/compose/.env.example}
      AGENT_PORT: "9105"
      # 留空可正常启动（对话时返回明确错误提示，见 .env.example 注释）
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-https://api.deepseek.com}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-deepseek-flash}
      BILLING_ADDR: billing:9101
      BILLING_ADMIN_ADDR: http://billing:9103
      MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:-root}@tcp(mysql:3306)/ai_gateway?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-}
      ADMIN_DEFAULT_TENANT: ${ADMIN_DEFAULT_TENANT:-1}
    ports:
      - "9105:9105"
    depends_on:
      # infra 属另一 profile：单独 --profile ai 时依赖自动跳过（容器经 restart 轮询重试）
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9105/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12

  gateway:
    profiles: [ai]
    build:
      context: ../../ai-gateway
      dockerfile: deploy/docker/go-service.Dockerfile
      args: { SVC: gateway }
    image: my-market/gateway:local
    restart: unless-stopped
    environment:
      LISTEN_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:?CONTROL_PLANE_TOKEN is required - see deploy/compose/.env.example}
      # 默认 8080 常被占，显式 18080（与旧仓 README 快速开始一致）
      GATEWAY_PORT: "18080"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-600}
      BILLING_ADDR: billing:9101
      BILLING_ADMIN_ADDR: http://billing:9103
      ROUTER_ADDR: http://router:9102
      AGENT_ADDR: http://agent:9105
      # reconciler 暂无容器（R0 不起）；面板 /admin/health 聚合该项会显示不可达，不影响其余功能
      RECONCILER_ADDR: http://reconciler:9106
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-}
      ADMIN_DEFAULT_TENANT: ${ADMIN_DEFAULT_TENANT:-1}
    ports:
      - "18080:18080"
    depends_on:
      - billing
      - router
      - agent
    healthcheck:
      # gateway 无 /healthz 路由；探首页（管理面板 HTML，200）等价存活
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:18080/"]
      interval: 10s
      timeout: 3s
      retries: 12

  mock-provider:
    profiles: [ai]
    build:
      context: ../../ai-gateway
      dockerfile: deploy/docker/go-service.Dockerfile
      args: { SVC: mock-provider }
    image: my-market/mock-provider:local
    restart: unless-stopped
    # 注意：schema.sql 种子数据把 provider 地址写成宿主回环 http://127.0.0.1:9201/9202
    # （scripts/schema.sql providers 表），容器内 router 够不到 127.0.0.1。
    # R0-T4 smoke 需用 admin API 或 SQL 把 provider 重指到 compose 服务名
    # （http://mock-provider:9201），在那之前 gateway→router→mock 完整对话链路不通；
    # 本服务自身启动/健康不受影响。
    environment:
      LISTEN_HOST: 0.0.0.0
      MOCK_PROVIDER_PORT: ${MOCK_PROVIDER_PORT:-9201}
      MOCK_PROVIDER_NAME: ${MOCK_PROVIDER_NAME:-mock-provider}
      # 故障/延迟注入默认关闭（故障演练时改 .env：MOCK_FAIL_RATE=50 等）
      MOCK_FAIL_RATE: ${MOCK_FAIL_RATE:-0}
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-0}
    ports:
      - "${MOCK_PROVIDER_PORT:-9201}:${MOCK_PROVIDER_PORT:-9201}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:${MOCK_PROVIDER_PORT:-9201}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12

  # ================= mall（R1）=================
  # 三服务同镜像模板 deploy/docker/mall-service.Dockerfile（上下文=仓库根）。
  # 容器内互访走服务名 + 容器端口（mall-goods:9111 / mall-order:9112 / redis:6379），
  # 与宿主映射端口无关；服务监听 ":端口"（全零地址）天然可被映射/互访。
  mall-goods:
    profiles: [mall]
    build:
      # 仓库根（根 go.mod 所在）——与 Dockerfile 注释的“上下文=仓库根”一致
      context: ../..
      dockerfile: deploy/docker/mall-service.Dockerfile
      args: { SVC: mall-goods }
    image: my-market/mall-goods:local
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MARKET_MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:-root}@tcp(mysql:3306)/market?charset=utf8mb4&parseTime=true&loc=Local
      # gRPC 业务口 9111 / HTTP 健康口 9110（容器内探活，不发布宿主）
    ports:
      - "9111:9111" # gRPC（grpcurl 宿主调试用；9110 健康口不发布，注释说明）
    depends_on:
      # infra 属另一 profile：单独 --profile mall 时依赖自动跳过（OpenStore 起服即 ping，
      # mysql 未就绪则容器 restart 重试；全家桶起法下等待健康）
      mysql:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9110/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12

  mall-order:
    profiles: [mall]
    build:
      context: ../..
      dockerfile: deploy/docker/mall-service.Dockerfile
      args: { SVC: mall-order }
    image: my-market/mall-order:local
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MARKET_MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:-root}@tcp(mysql:3306)/market?charset=utf8mb4&parseTime=true&loc=Local
      # R2：credit 行履约/退款冲退走 billing gRPC（容器内服务名 + 容器端口；
      # 宿主映射口 9101 与容器内 9101 同值）。CONTROL_PLANE_TOKEN 与 ai 组
      # 同源共享（billing 全方法 X-Control-Token 门禁），未设置解析期即报错。
      BILLING_ADDR: billing:9101
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:?CONTROL_PLANE_TOKEN is required - see deploy/compose/.env.example}
      # gRPC 业务口 9112 / HTTP 健康口 9120；进程内 worker（履约 outbox 10s 轮 +
      # 超时关单 60s 轮）随容器起停，无独立容器
    ports:
      - "9112:9112" # gRPC（宿主调试用；9120 健康口不发布）
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9120/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12

  mall-bff:
    profiles: [mall]
    build:
      context: ../..
      dockerfile: deploy/docker/mall-service.Dockerfile
      args: { SVC: mall-bff }
    image: my-market/mall-bff:local
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 回调验签 HMAC 密钥：/payments/callback 验签与 mock provider 签名共用，
      # 未设置服务直接退出（main.go log.Fatal）——compose 用 :? 解析期即报错。
      # 生成：openssl rand -hex 32（写入 deploy/compose/.env）
      PAY_CALLBACK_SECRET: ${PAY_CALLBACK_SECRET:?PAY_CALLBACK_SECRET is required - see deploy/compose/.env.example}
      # 容器内地址一律服务名；PAY_CALLBACK_URL 是 mock provider 自回打基址
      # （bff → 自身），置服务名而非 127.0.0.1，与“容器部署置对外可达地址”口径一致
      BFF_ADDR: ":18090"
      PAY_CALLBACK_URL: http://mall-bff:18090
      GOODS_ADDR: mall-goods:9111
      ORDER_ADDR: mall-order:9112
      GATEWAY_ADDR: http://gateway:18080
      # 与 ai 组共用同一 Redis 实例（compose 无密码启动）；mall-bff 现行代码
      # 只读 REDIS_ADDR 不读 REDIS_PASSWORD（本地未设密码，与 ai 侧同变量名预留，
      # 若后续给 redis 设密码需先补 bff 的 go-redis Password 透传）
      REDIS_ADDR: redis:6379
      # R2：/me/overview 余额/流水走 billing 两侧（gRPC 9101 + admin HTTP 9103，
      # 均带 X-Control-Token；token 与 ai 组同源共享，未设置解析期即报错）
      BILLING_ADDR: billing:9101
      BILLING_ADMIN_ADDR: http://billing:9103
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:?CONTROL_PLANE_TOKEN is required - see deploy/compose/.env.example}
      # per-tenant 限流走契约默认 120 req/min（api-contract §8），不沿用 ai 组
      # 的 RATE_LIMIT_PER_MIN（那是 gateway 数据面阈值，语义不同）
    ports:
      - "18090:18090" # REST 唯一入口 /api/v1 + /healthz
    depends_on:
      mall-goods:
        condition: service_healthy
      mall-order:
        condition: service_healthy
      # ai 组的 gateway（会话链路 /auth/* 代理）跨 profile：required=false，
      # 单独 --profile mall 起时跳过等待（gw 会话校验经 restart 轮询恢复）
      gateway:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:18090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  mysql-data:
  redis-data:
  kafka-data:
