version: v2
# billing proto 生成配置（纯 Go 工具链：buf 自带编译器，无需 protoc 二进制）。
# 插件安装：my-market 仓根 `make proto-tools`（装进 `go env GOPATH`/bin）。
# 用法（本目录下执行）：
#   PATH="$(go env GOPATH)/bin:$PATH" buf generate pkg/proto
# 输出（source_relative）：pkg/proto/billing/v1/{billing.pb.go,billing_grpc.pb.go}
plugins:
  - local: protoc-gen-go
    out: pkg/proto
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: pkg/proto
    opt: paths=source_relative
