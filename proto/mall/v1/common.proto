syntax = "proto3";

// mall.v1 是商城垂直切片（R1）的跨服务契约包。
// 权威规格：docs/spec/api-contract.md 与 docs/plans/2026-11-18-R1-商城垂直切片.md。
// 变更先改契约文档，再改这里并 `make proto` 重新生成。
package mall.v1;

option go_package = "github.com/frostloom/my-market/services/mall-gen/mallv1;mallv1";

// PageReq 键集游标分页请求（api-contract §0.3）。
// 首页不传 cursor；page_size 默认 20、上限 50（BFF 侧裁剪）。
message PageReq {
  string cursor = 1;
  int32 page_size = 2;
}

// GoodsItem 商品（列表 / 详情 / 购物车行 / 订单快照引用共用）。
// type 编码：1=general 2=recharge 3=subscription（契约 §3 的
// "general|recharge|subscription"）；recharge 附 face_value_cent/bonus_cent。
// detail 仅详情（GET /goods/{id}）填充；列表项恒为空串（契约 §3）。
// token_estimate 仅 recharge 填充：按轻量档模型单价把
// face_value_cent+bonus_cent 换算成 token 数的营销展示，不作入账依据。
message GoodsItem {
  uint64 id = 1;
  int32 type = 2;
  string name = 3;
  string subtitle = 4;
  int64 price_cent = 5;
  int64 orig_price_cent = 6;
  int64 face_value_cent = 7;
  int64 bonus_cent = 8;
  string image_url = 9;
  int32 stock = 10;
  bool on_sale = 11;
  uint64 ref_plan_id = 12; // subscription 引用的订阅套餐 id，其余为 0
  string detail = 13;      // 详情富文本（仅 GetGoods 填充）
  int64 token_estimate = 14; // recharge 营销展示 token 数（非入账依据）
}

// Category 商品品类（六个，精选为运营位）。
message Category {
  uint64 id = 1;
  string name = 2;
  int32 sort = 3;
}
