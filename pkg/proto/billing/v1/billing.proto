// billing 计费服务的 gRPC 契约（控制面）。
//
// 状态机（bills 表 reserve 行）：
//
//	Reserve(原子扣减+落库) → [pending]
//	  ── ReportUsage(写 usage_reported_at 持久 marker) → [pending + marker]
//	        ── Settle(幂等) → [settled]（写 settle 行，delta 冲正 Redis）
//	  ── Reverse(幂等) → [reversed]（Redis 退回预扣）
syntax = "proto3";

package billing.v1;

// 勿改（descriptor 字节稳定）：go_package 保留 R2.7 服务拆分前的旧模块路径
// github.com/frostloom/ai-gateway/...——billing.pb.go 的 rawDesc 按字节记录该
// 字符串，改动并重新生成 = descriptor 字节漂移（行为面连带变化）。
// 生成物物理位置已是 pkg/proto/billing/v1/（R2.7 树迁），编译与 import 不受
// 此逻辑路径影响；待本契约首次真实演进时再一并裁定是否随迁。
option go_package = "github.com/frostloom/ai-gateway/pkg/proto/billing/v1;billingv1";

// BillingService 计费控制面。除 GetBalance/ValidateAPIKey/RebuildBalance 外全部幂等。
service BillingService {
  // 预占额度：原子「判余额 ≥ 预扣额 再扣减」，修复 new-api 的 check-then-act 超卖缺陷。
  // 同一 request_id 重复调用不重复扣（Redis guard + bills 唯一索引双保险）。
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
  // 上报实际用量：gateway 在流结束/响应完成后调用，写 usage_reported_at 作为持久 marker，幂等。
  rpc ReportUsage(ReportUsageRequest) returns (ReportUsageResponse);
  // 结算：pending → settled，按实际用量冲正（正补扣 / 负退回），幂等。
  rpc Settle(SettleRequest) returns (SettleResponse);
  // 冲正/退款：pending → reversed，退回全部预扣，幂等。
  rpc Reverse(ReverseRequest) returns (ReverseResponse);
  // 查询租户当前余额（Redis 投影；权威口径是 MySQL bills 账本，重建 job 兜底）。
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  // 校验 API Key：gateway 不碰 MySQL，密钥校验统一走 billing 控制面。
  rpc ValidateAPIKey(ValidateAPIKeyRequest) returns (ValidateAPIKeyResponse);
  // 从账本重建余额投影（M4 对账兜底）：以 MySQL bills 为权威重算 Redis balance，
  // 收敛「预扣已扣但落库失败/结算丢失」等任何脏投影。
  rpc RebuildBalance(RebuildBalanceRequest) returns (RebuildBalanceResponse);
  // 入账（R2 商城充值闭环，加法改造）：复用 topups 同步事务路径——
  // topup 行 + tenants.ledger_balance 同事务，uk_ref(ref_type,ref_id) 为幂等提交点。
  // 同 ref 重放 no-op：返回当前余额与 created=false。
  rpc Credit(CreditRequest) returns (CreditReply);
  // 退款（R2 商城冲退，加法改造）：实际退额 = min(amount_cent, 当前余额)，绝不退负；
  // ref 为幂等锚点（topups ref_type="refund", ref_id=ref）。同 ref 重放 no-op：refunded_cent=0。
  rpc Refund(RefundRequest) returns (RefundReply);
  // 开通/续期月卡订阅（R2.5 商城月卡闭环，加法改造）：幂等 ref 锚在 topups
  // （ref_type="mall-sub"，ref_id=ref，0 元流水复用 uk_ref，零 schema 改动）。
  // 无本期权益 → 按 plan 开通本期（模拟月费校验，不接真钱）；
  // 已有本期权益 → 自本期期满顺延一个周期（RenewDue 单租户等价，跨套餐 fail-closed）；
  // 同 ref 重放 no-op 返回当前订阅摘要；跨租户 ref → FailedPrecondition。
  rpc ActivateSubscription(ActivateSubscriptionRequest) returns (ActivateSubscriptionReply);
  // 退订（R2.5「退款=退订」语义，加法改造）：置 auto_renew=0、当期权益保留至期满、不退费；
  // 已退订重放 no-op（定点收敛状态迁移天然幂等，ref 仅作审计关联锚，不落账本行）。
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionReply);
}

message ReserveRequest {
  string request_id = 1;           // gateway 生成（幂等键或 uuid），全局唯一
  int64 tenant_id = 2;
  int64 api_key_id = 3;
  int64 provider_id = 4;           // router 选出的 provider；M5 前可为 0
  string model = 5;
  int64 est_prompt_tokens = 6;     // gateway 对输入消息的估算
  int64 max_completion_tokens = 7; // 可选输出上限；0 表示不限制
}

enum ReserveCode {
  RESERVE_OK = 0;
  RESERVE_INSUFFICIENT = 1;        // 余额不足
  RESERVE_DUPLICATE = 2;           // 已有同 request_id 预占（幂等重放）
  RESERVE_SUB_QUOTA = 3;           // 订阅额度不足（每 N 小时滚动刷新，M9）
}

message ReserveResponse {
  ReserveCode code = 1;
  int64 bill_id = 2;               // reserve 行 id
  int64 balance_after = 3;         // 预占后的余额
}

message ReportUsageRequest {
  string request_id = 1;
  int64 bill_id = 2;
  int64 prompt_tokens = 3;
  int64 completion_tokens = 4;
  int64 provider_id = 5;           // 实际交付响应的 provider（含 failover）；0 保留预占归属
}

message ReportUsageResponse {
  bool accepted = 1;
}

message SettleRequest {
  string request_id = 1;
  int64 bill_id = 2;
}

message SettleResponse {
  bool settled = 1;
  int64 delta_quota = 2;           // 实际 - 预扣（正补扣 / 负退回）
  int64 balance_after = 3;
}

message ReverseRequest {
  string request_id = 1;
  int64 bill_id = 2;
  string reason = 3;               // 对账冲正/上游故障/客户端断连等
}

message ReverseResponse {
  bool reversed = 1;
  int64 refund_quota = 2;          // 退回的预扣额度
}

message GetBalanceRequest {
  int64 tenant_id = 1;
}

message GetBalanceResponse {
  int64 balance = 1;
}

message ValidateAPIKeyRequest {
  string api_key_hash = 1; // SHA-256(key)，明文 sk- 永不跨服务传递
}

message ValidateAPIKeyResponse {
  bool valid = 1;
  int64 api_key_id = 2;
  int64 tenant_id = 3;
}

message RebuildBalanceRequest {
  int64 tenant_id = 1;
}

message RebuildBalanceResponse {
  int64 balance = 1;   // 重建后的余额（投影）
}

message CreditRequest {
  int64 tenant_id = 1;
  int64 amount_cent = 2;  // 必须 > 0
  string ref_type = 3;    // 幂等键前半（如 "mall"）；1-16 字符（兼作 topups.source）
  string ref_id = 4;      // 幂等键后半（如 order_no:line_no）；1-64 字符
}

message CreditReply {
  int64 balance_cent = 1; // 入账后余额（账本口径，已同步 Redis 投影）
  bool created = 2;       // false = 同 ref 已入账过（no-op）
}

message RefundRequest {
  int64 tenant_id = 1;
  int64 amount_cent = 2;  // 必须 > 0；实际退额 = min(此值, 当前余额)
  string ref = 3;         // 幂等锚点（topups ref_id，ref_type 固定 "refund"）；1-64 字符
}

message RefundReply {
  int64 refunded_cent = 1; // 实际退额；同 ref 重放为 0（no-op）
}

// SubscriptionSummary 订阅摘要（开通/退订 RPC 的返回；无订阅时各字段零值）。
message SubscriptionSummary {
  int64 plan_id = 1;      // 生效套餐
  string status = 2;      // active/cancelled；无订阅为空
  bool auto_renew = 3;    // 到期自动续费
  int64 cycle_num = 4;    // 已续期数
  int64 period_start = 5; // 本期起（Unix 秒）；0=无订阅
  int64 period_end = 6;   // 本期止（Unix 秒）；0=无订阅
}

message ActivateSubscriptionRequest {
  int64 tenant_id = 1;
  int64 plan_id = 2; // 必须为在售（status=0）定期订阅套餐
  string ref = 3;    // 幂等锚点（topups ref_type="mall-sub"，ref_id=ref）；1-64 字符
}

message ActivateSubscriptionReply {
  bool activated = 1;  // true=本次生效（开通或续一期）；false=同 ref 重放 no-op
  bool is_renewal = 2; // true=本次为续一期（自本期期满顺延一个周期）
  SubscriptionSummary subscription = 3;
}

message CancelSubscriptionRequest {
  int64 tenant_id = 1;
  string ref = 2; // 审计关联锚；1-64 字符（幂等来自状态定点收敛，见服务注释）
}

message CancelSubscriptionReply {
  bool cancelled = 1; // true=本次置退订；false=已退订（no-op）
  SubscriptionSummary subscription = 2;
}
